ext {
    trackAsiaDeveloperId = 'trackasia'
    trackAsiaDeveloperName = 'TrackAsia'
    trackAsiaDeveloperMail = 'team@track-asia.com'
    trackAsiaDeveloperOrganization = 'TrackAsia'

    navigationArtifactGroupId = 'io.github.track-asia'
    navigationArtifactTitle = 'TrackAsia Navigation SDK'
    navigationArtifactDescription = 'TrackAsia Navigation build on Kotlin Multiplatform'
    navigationDeveloperOrganizationUrl = 'http://www.track-asia.com'
    navigationArtifactUrl = 'https://github.com/trackasia/trackasia-navigation-android'
    navigationArtifactVcsUrl = 'https://github.com/trackasia/trackasia-navigation-android.git'
    navigationArtifactScmUrl = 'scm:git@github.com:trackasia/trackasia-navigation-android.git'
    navigationArtifactLicenseName = 'MIT'
    navigationArtifactLicenseUrl = 'https://opensource.org/license/MIT'

    versionName = getVersionName()
    isSnapshot = isSnapshot()
}

def getVersionName() {
    // Try to read from VERSION file first
    def versionFile = new File("${rootDir}/VERSION")
    if (versionFile.exists()) {
        def versionFromFile = versionFile.text.trim()
        project.logger.info("Version read from VERSION file: ${versionFromFile}")
        return versionFromFile
    }
    
    // Fall back to environment variable if file doesn't exist
    def version = System.getenv('VERSION')
    if (version) {
        def deducedVersion = isSnapshot() ? getSnapshotVersion(version) : version
        project.logger.info("Version from environment variable: ${deducedVersion}")
        return deducedVersion
    }
    
    // Default version if neither source is available
    def defaultVersion = "0.0.0"
    project.logger.warn("No version found in VERSION file or environment. Using default: ${defaultVersion}")
    return defaultVersion
}

def isSnapshot() {
    def snapshotProp = findProperty("snapshot")
    return snapshotProp ? snapshotProp.asBoolean() : false
}

private static def getSnapshotVersion(String version) {
    def matcher = version =~ /^[v|V](\d+).(\d+)?.*/
    def major = (matcher[0][1] as Integer)
    def minor = (matcher[0][2] as Integer) + 1
    return "${major}.${minor}.0-SNAPSHOT"
}
